<!doctype html><html><head><meta charset="utf-8"><title>Larchmont Expenses</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f4f5f7;color:#172b4d}
.top{height:56px;background:#0b3d5c;color:#fff;display:flex;align-items:center;padding:0 24px;gap:28px}
.top b{font-size:18px}.top a{color:#cfe3f0;text-decoration:none}
.wrap{display:flex;gap:24px;padding:24px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:20px}
.form{width:380px}.form h2,.list h2{margin:0 0 16px;font-size:17px}
label{display:block;font-size:12px;font-weight:600;color:#5e6c84;margin:12px 0 4px}
input,select{width:100%;height:36px;border:1px solid #c1c7d0;border-radius:4px;padding:0 10px;font-size:14px;background:#fff}
.row2{display:flex;gap:12px}.row2>div{flex:1}
.btns{display:flex;gap:10px;margin-top:20px}
button{height:36px;padding:0 18px;border-radius:4px;border:1px solid #c1c7d0;background:#fff;font-size:14px;cursor:pointer}
#save{background:#0b6bcb;color:#fff;border-color:#0b6bcb}
.list{flex:1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #ebecf0}th{font-size:12px;color:#5e6c84}
td.amt{text-align:right}th.amt{text-align:right}
#msg{margin-top:12px;font-size:13px;color:#006644;min-height:18px}
.err{color:#bf2600!important}
</style></head><body>
<div class="top"><b>Larchmont Expenses</b><a href="#">My expenses</a><a href="#">Approvals</a><a href="#">Reports</a></div>
<div class="wrap"><div class="card form"><h2>New expense</h2>
<label for="desc">Description</label><input id="desc" placeholder="What was it for?">
<div class="row2"><div><label for="amount">Amount</label><input id="amount" placeholder="0.00"></div><div><label for="currency">Currency</label><select id="currency"><option>EUR</option><option>USD</option><option>GBP</option></select></div></div>
<label for="category">Category</label><select id="category"><option value="">Choose a category</option><option>Meals</option><option>Office supplies</option><option>Software</option><option>Travel</option><option>Training</option></select>
<label for="date">Date</label><input id="date" value="2026-11-17">
<div class="btns"><button id="save">Save expense</button><button id="cancel">Cancel</button></div><div id="msg"></div></div>
<div class="card list"><h2>Recent expenses</h2><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="amt">Amount</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script src="cselect.js"></script><script>
const rows=[["2026-11-12","Printer toner","Office supplies","89.90 EUR"],["2026-11-10","Client lunch, Porto","Meals","64.20 EUR"],["2026-11-06","Figma seat","Software","15.00 USD"]];
function render(){document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="amt">${r[3]}</td></tr>`).join('');window.appState={rows:rows.map(r=>r.slice())}}
document.getElementById('save').onclick=()=>{const d=desc.value.trim(),a=amount.value.trim(),c=category.value,m=document.getElementById('msg');
 if(!d||!a||!c){m.className='err';m.textContent='Fill in description, amount and category.';return}
 rows.unshift([date.value,d,c,(parseFloat(a.replace(',','.'))||0).toFixed(2)+' '+currency.value]);m.className='';m.textContent='Expense saved.';desc.value='';amount.value='';category.value='';category._sync();render()};
document.getElementById('cancel').onclick=()=>{desc.value='';amount.value='';category.value='';category._sync()};
render();
</script></body></html>
