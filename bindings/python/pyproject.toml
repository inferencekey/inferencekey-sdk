[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "inferencekey"
version = "0.1.0"
description = "Official InferenceKey SDK — declare AI workloads in code, ensure they exist, and call the resulting OpenAI-compatible endpoints."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "InferenceKey", email = "dev@inferencekey.com" }]
keywords = ["inferencekey", "ai", "llm", "inference", "openai-compatible", "sdk"]
# No incluimos un classifier `License ::`: con `license = "Apache-2.0"` (SPDX,
# PEP 639) la licencia ya va en los metadatos y los build tools modernos
# rechazan duplicarla como classifier.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.inferencekey.com"
Documentation = "https://docs.inferencekey.com"
Repository = "https://github.com/inferencekey/inferencekey-sdk"
Issues = "https://github.com/inferencekey/inferencekey-sdk/issues"

[tool.maturin]
# The native extension is `_inferencekey`; the pure-Python wrapper package
# `inferencekey` (under python/) re-exports an ergonomic, typed surface over it.
module-name = "inferencekey._inferencekey"
python-source = "python"
features = ["pyo3/extension-module"]
