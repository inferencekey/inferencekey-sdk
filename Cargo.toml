[workspace]
resolver = "2"
members = ["core", "capi", "bindings/python", "bindings/node", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["InferenceKey <dev@inferencekey.com>"]
repository = "https://github.com/inferencekey/inferencekey-sdk"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
futures-util = "0.3"
tracing = "0.1"
# Native HTTP/SSE transport for custom backends. Only the `server` crate (and,
# through it, the Python binding) depends on these, so capi and node never
# compile the hyper server. All of them were already in Cargo.lock as reqwest
# transitives.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
